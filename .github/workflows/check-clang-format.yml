name: Check Clang Format

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install clang-format
        run: pip install clang-format==18.1.3

      - name: Check formatting
        run: |
          JAVA_FILES=$(find src test -name '*.java')
          if [ -z "$JAVA_FILES" ]; then
            echo "No Java files found."
            exit 0
          fi
          if ! echo "$JAVA_FILES" | xargs clang-format --dry-run --Werror 2>&1; then
            echo ""
            echo "Java files are not formatted. Run 'make format' locally to fix."
            exit 1
          fi
          echo "All Java files are properly formatted."

      - name: Check import ordering
        run: |
          python3 scripts/java_import_sorter.py --check src test